name: CI and desktop installers

on:
  workflow_dispatch:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build frontend
        run: npm run build

  desktop:
    name: ${{ matrix.name }}
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runner: macos-14
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            build_args: --bundles app,dmg --target universal-apple-darwin
            artifact: json-forge-macos
            paths: |
              src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.zip
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: Windows
            runner: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            build_args: --bundles msi,nsis
            artifact: json-forge-windows
            paths: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Run tests before packaging
        run: npm test

      - name: Build unsigned desktop bundles
        run: npm run tauri -- build ${{ matrix.build_args }}

      - name: Archive macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent "src-tauri/target/universal-apple-darwin/release/bundle/macos/JSON Forge.app" "src-tauri/target/universal-apple-darwin/release/bundle/macos/JSON Forge.app.zip"

      - name: Upload unsigned bundles
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ github.ref_name }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          retention-days: 14
