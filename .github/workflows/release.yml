name: CI and desktop installers

on:
  workflow_dispatch:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build frontend
        run: npm run build

  desktop:
    name: ${{ matrix.name }}
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runner: macos-14
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            build_args: --bundles app,dmg --target universal-apple-darwin
            artifact: json-forge-macos
            paths: |
              src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.zip
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: Windows
            runner: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            build_args: --bundles msi,nsis
            artifact: json-forge-windows
            paths: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Run tests before packaging
        run: npm test

      - name: Build unsigned desktop bundles
        run: npm run tauri -- build ${{ matrix.build_args }}

      - name: Archive macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent "src-tauri/target/universal-apple-darwin/release/bundle/macos/JSON Forge.app" "src-tauri/target/universal-apple-darwin/release/bundle/macos/JSON Forge.app.zip"

      - name: Upload unsigned bundles
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ github.ref_name }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: ubuntu-latest

    # 仅本 job 需要写权限，用于创建 release 并上传安装包。
    permissions:
      contents: write

    steps:
      - name: Download platform bundles
        uses: actions/download-artifact@v4
        with:
          pattern: json-forge-*
          merge-multiple: true
          path: installers

      - name: List downloaded bundles
        run: find installers -type f -print

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: JSON Forge ${{ github.ref_name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            installers/**/*.dmg
            installers/**/*.app.zip
            installers/**/*.msi
            installers/**/*.exe
          body: |
            JSON Forge ${{ github.ref_name }} 桌面安装包。

            | 平台 | 文件 |
            | --- | --- |
            | macOS (Intel + Apple Silicon) | `.dmg` 安装镜像，或 `.app.zip` 直接解压运行 |
            | Windows x64 | `.msi` 安装包，或 NSIS `.exe`（安装到当前用户） |

            ## 安装包未签名

            这些产物没有经过 Apple Developer ID 签名与公证，也没有 Windows
            Authenticode 签名，因此系统会拦截：

            - macOS：首次打开会提示无法验证开发者。在 Finder 里右键点击应用选「打开」，
              或执行 `xattr -dr com.apple.quarantine "/Applications/JSON Forge.app"`。
            - Windows：SmartScreen 会提示「未知发布者」，点「更多信息」→「仍要运行」。
